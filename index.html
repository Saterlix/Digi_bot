<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThunderPay</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ════════════════════════════════════════
           CSS RESET & VARIABLES
           ════════════════════════════════════════ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: var(--tg-theme-bg-color, #0b0f19);
            --bg-card: var(--tg-theme-secondary-bg-color, #141a2a);
            --text: var(--tg-theme-text-color, #e8ecf4);
            --text-muted: var(--tg-theme-hint-color, #6b7a99);
            --accent: var(--tg-theme-button-color, #6c5ce7);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --link: var(--tg-theme-link-color, #7c6ff7);
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --border: rgba(255, 255, 255, 0.06);
            --glass: rgba(255, 255, 255, 0.04);
            --radius: 14px;
            --nav-h: 64px;
            --header-h: 56px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ════════════════════════════════════════
           HEADER
           ════════════════════════════════════════ */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
        }

        .header-brand span {
            font-size: 22px;
        }

        .header-balance {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--accent);
            color: var(--accent-text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s;
        }

        .header-balance:active {
            transform: scale(0.95);
        }

        /* ════════════════════════════════════════
           MAIN CONTENT AREA
           ════════════════════════════════════════ */
        .content {
            padding-top: calc(var(--header-h) + 12px);
            padding-bottom: calc(var(--nav-h) + 24px);
            padding-left: 16px;
            padding-right: 16px;
            min-height: 100vh;
        }

        .page {
            display: none;
            animation: fadeUp .3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ════════════════════════════════════════
           BOTTOM NAVIGATION
           ════════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-h);
            display: flex;
            align-items: center;
            justify-content: space-around;
            background: rgba(11, 15, 25, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: transform .15s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        .nav-icon {
            font-size: 22px;
            transition: .2s;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            transition: color .2s;
        }

        .nav-item.active .nav-label {
            color: var(--accent);
        }

        .nav-item.active .nav-icon {
            transform: scale(1.15);
        }

        /* ════════════════════════════════════════
           SECTION TITLES
           ════════════════════════════════════════ */
        .section-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .section-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: -10px;
            margin-bottom: 16px;
        }

        /* ════════════════════════════════════════
           CATEGORY CHIPS
           ════════════════════════════════════════ */
        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            transition: all .2s;
        }

        .chip.active {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        /* ════════════════════════════════════════
           GAME CARDS GRID
           ════════════════════════════════════════ */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 12px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform .15s, box-shadow .2s;
            overflow: hidden;
        }

        .game-card:active {
            transform: scale(0.97);
        }

        .game-card-emoji {
            font-size: 36px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        .game-card img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        .game-card-name {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
        }

        .game-card-tag {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
        }

        .game-card-glow {
            position: absolute;
            top: -30px;
            right: -30px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.25;
            pointer-events: none;
        }

        /* ════════════════════════════════════════
           BOTTOM SHEET OVERLAY
           ════════════════════════════════════════ */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            padding: 12px 20px 32px;
            z-index: 201;
            transform: translateY(100%);
            transition: transform .3s cubic-bezier(.22, .68, 0, 1);
        }

        .sheet.show {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .sheet-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .sheet-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 20px;
        }

        /* ════════════════════════════════════════
           FORM ELEMENTS
           ════════════════════════════════════════ */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text);
            outline: none;
            transition: border-color .2s;
            font-family: inherit;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: var(--accent-text);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s, opacity .2s;
            font-family: inherit;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            font-family: inherit;
        }

        /* ════════════════════════════════════════
           WALLET PAGE
           ════════════════════════════════════════ */
        .balance-hero {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: var(--radius);
            padding: 28px 24px;
            text-align: center;
            margin-bottom: 24px;
        }

        .balance-hero-label {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
        }

        .balance-hero-amount {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
        }

        .balance-hero-amount small {
            font-size: 16px;
            font-weight: 600;
        }

        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .amount-btn {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--glass);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }

        .amount-btn.selected {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        /* ════════════════════════════════════════
           HISTORY PAGE
           ════════════════════════════════════════ */
        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
        }

        .history-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .history-info {
            flex: 1;
        }

        .history-name {
            font-size: 14px;
            font-weight: 600;
        }

        .history-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .history-amount {
            font-size: 14px;
            font-weight: 700;
        }

        .history-amount.debit {
            color: var(--danger);
        }

        .history-amount.credit {
            color: var(--success);
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-success {
            background: rgba(46, 213, 115, 0.15);
            color: var(--success);
        }

        .status-pending {
            background: rgba(255, 165, 2, 0.15);
            color: var(--warning);
        }

        .status-failed {
            background: rgba(255, 71, 87, 0.15);
            color: var(--danger);
        }

        /* ════════════════════════════════════════
           SETTINGS PAGE
           ════════════════════════════════════════ */
        .settings-group {
            margin-bottom: 24px;
        }

        .settings-group-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: transform .15s;
        }

        .settings-item:active {
            transform: scale(0.98);
        }

        .settings-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-item-icon {
            font-size: 22px;
        }

        .settings-item-label {
            font-size: 14px;
            font-weight: 600;
        }

        .settings-item-value {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .settings-item-arrow {
            color: var(--text-muted);
            font-size: 16px;
        }

        .lang-option {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all .2s;
        }

        .lang-option.active {
            border-color: var(--accent);
            background: rgba(108, 92, 231, 0.08);
        }

        .lang-option-flag {
            font-size: 24px;
        }

        .lang-option-name {
            font-size: 14px;
            font-weight: 600;
            flex: 1;
        }

        .lang-option-check {
            font-size: 18px;
            color: var(--accent);
        }

        /* ════════════════════════════════════════
           EMPTY STATE
           ════════════════════════════════════════ */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state-text {
            font-size: 14px;
        }

        /* ════════════════════════════════════════
           TOAST
           ════════════════════════════════════════ */
        .toast {
            position: fixed;
            top: calc(var(--header-h) + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            z-index: 500;
            transition: transform .3s cubic-bezier(.22, .68, 0, 1);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: var(--success);
            color: var(--success);
        }

        .toast.error {
            border-color: var(--danger);
            color: var(--danger);
        }

        .toast.info {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ════════════════════════════════════════
           PROFILE CARD
           ════════════════════════════════════════ */
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-text);
        }

        .profile-name {
            font-size: 16px;
            font-weight: 700;
        }

        .profile-id {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <!-- ══════════ HEADER ══════════ -->
    <header class="header">
        <div class="header-brand">
            <span>⚡</span> ThunderPay
        </div>
        <div class="header-balance" onclick="navigateTo('wallet')">
            💰 <span id="headerBalance">0</span> <small>UZS</small>
        </div>
    </header>

    <!-- ══════════ CONTENT ══════════ -->
    <div class="content">

        <!-- PAGE: ASOSIY (CATALOG) -->
        <div class="page active" id="page-home">
            <h2 class="section-title" data-i18n="catalog_title">🎮 O'yinlar katalogi</h2>
            <div class="chips" id="categoryChips"></div>
            <div class="games-grid" id="gamesGrid"></div>
        </div>

        <!-- PAGE: HAMYON (WALLET) -->
        <div class="page" id="page-wallet">
            <h2 class="section-title" data-i18n="wallet_title">💳 Hamyon</h2>
            <div class="balance-hero">
                <div class="balance-hero-label" data-i18n="your_balance">Sizning balansingiz</div>
                <div class="balance-hero-amount"><span id="walletBalance">0</span> <small>UZS</small></div>
            </div>
            <p class="section-subtitle" data-i18n="choose_amount">Summani tanlang yoki o'zingiz kiriting</p>
            <div class="amount-grid" id="amountGrid"></div>
            <div class="input-group">
                <input type="number" class="input-field" id="depositInput" data-i18n-placeholder="custom_amount"
                    placeholder="Boshqa summa (min 1 000)">
            </div>
            <button class="btn-primary" id="btnDeposit" data-i18n="deposit_btn" onclick="handleDeposit()">💰 Balansni
                to'ldirish</button>
        </div>

        <!-- PAGE: TARIX (HISTORY) -->
        <div class="page" id="page-history">
            <h2 class="section-title" data-i18n="history_title">📦 Buyurtmalar tarixi</h2>
            <div id="historyList"></div>
        </div>

        <!-- PAGE: SOZLAMALAR (SETTINGS) -->
        <div class="page" id="page-settings">
            <h2 class="section-title" data-i18n="settings_title">⚙️ Sozlamalar</h2>

            <div class="profile-card">
                <div class="profile-avatar" id="settingsAvatar">U</div>
                <div>
                    <div class="profile-name" id="settingsName">User</div>
                    <div class="profile-id" id="settingsId">ID: —</div>
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-group-title" data-i18n="language">Til</div>
                <div class="lang-option active" id="langUz" onclick="setLang('uz')">
                    <span class="lang-option-flag">🇺🇿</span>
                    <span class="lang-option-name">O'zbek tili</span>
                    <span class="lang-option-check" id="checkUz">✓</span>
                </div>
                <div class="lang-option" id="langRu" onclick="setLang('ru')">
                    <span class="lang-option-flag">🇷🇺</span>
                    <span class="lang-option-name">Русский</span>
                    <span class="lang-option-check" id="checkRu" style="display:none">✓</span>
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-group-title" data-i18n="about">Ilova haqida</div>
                <div class="settings-item" onclick="showToast('ThunderPay v2.0','info')">
                    <div class="settings-item-left">
                        <span class="settings-item-icon">📱</span>
                        <span class="settings-item-label" data-i18n="version">Versiya</span>
                    </div>
                    <span class="settings-item-value">2.0.0</span>
                </div>
                <div class="settings-item">
                    <div class="settings-item-left">
                        <span class="settings-item-icon">💬</span>
                        <span class="settings-item-label" data-i18n="support">Qo'llab-quvvatlash</span>
                    </div>
                    <span class="settings-item-arrow">→</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════ BOTTOM NAV ══════════ -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-page="home" onclick="navigateTo('home')">
            <span class="nav-icon">🏠</span>
            <span class="nav-label" data-i18n="nav_home">Asosiy</span>
        </div>
        <div class="nav-item" data-page="wallet" onclick="navigateTo('wallet')">
            <span class="nav-icon">💰</span>
            <span class="nav-label" data-i18n="nav_wallet">Hamyon</span>
        </div>
        <div class="nav-item" data-page="history" onclick="navigateTo('history')">
            <span class="nav-icon">📋</span>
            <span class="nav-label" data-i18n="nav_history">Tarix</span>
        </div>
        <div class="nav-item" data-page="settings" onclick="navigateTo('settings')">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label" data-i18n="nav_settings">Sozlamalar</span>
        </div>
    </nav>

    <!-- ══════════ BOTTOM SHEET (PURCHASE) ══════════ -->
    <div class="overlay" id="overlay" onclick="closeSheet()"></div>
    <div class="sheet" id="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="sheetGameName"></div>
        <div class="sheet-price" id="sheetProductName"></div>
        <div class="input-group">
            <label data-i18n="player_id_label">Player ID / Game ID</label>
            <input type="text" class="input-field" id="sheetPlayerId" data-i18n-placeholder="enter_player_id"
                placeholder="ID raqamingizni kiriting">
        </div>
        <button class="btn-primary" id="btnBuy" onclick="handleBuy()">⚡ Sotib olish</button>
        <button class="btn-secondary" onclick="closeSheet()" data-i18n="cancel">Bekor qilish</button>
    </div>

        // ─── CATEGORIES ───
        const CATEGORIES = [
            { id: 'all', i18n: 'cat_all' },
            { id: 'shooters', i18n: 'cat_shooters' },
            { id: 'moba', i18n: 'cat_moba' },
            { id: 'anime', i18n: 'cat_anime' },
            { id: 'other', i18n: 'cat_other' },
        ];

        // ─── DEPOSIT AMOUNTS ───
        const DEPOSIT_AMOUNTS = [5000, 10000, 25000, 50000, 100000, 200000];

        // ─── MOCK HISTORY ───
        const mockHistory = [];

        // ═══════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════
        function init() {
            if (tg) {
                tg.expand();
                tg.ready();
                tg.disableClosingConfirmation();
                tg.setHeaderColor('#0b0f19');
                tg.setBackgroundColor('#0b0f19');
            }

            // Get user info
            const user = tg?.initDataUnsafe?.user;
            if (user) {
                const name = user.first_name || 'User';
                document.getElementById('settingsName').textContent = name;
                document.getElementById('settingsId').textContent = `ID: ${user.id}`;
                document.getElementById('settingsAvatar').textContent = name.charAt(0).toUpperCase();
            }

            // Read lang from URL
            const params = new URLSearchParams(window.location.search);
            const urlLang = params.get('lang');
            if (urlLang === 'ru' || urlLang === 'uz') currentLang = urlLang;

            renderCategoryChips();
            renderGames();
            renderAmountGrid();
            renderHistory();
            applyLang();
        }

        // ═══════════════════════════════════════════════
        // NAVIGATION
        // ═══════════════════════════════════════════════
        function navigateTo(page) {
            currentPage = page;

            // Update nav
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });

            // Update pages
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('active');
            });
            const target = document.getElementById(`page-${page}`);
            if (target) {
                target.classList.add('active');
            }

            // Refresh data on certain pages
            if (page === 'wallet') updateBalanceDisplay();
            if (page === 'history') renderHistory();

            // Haptic
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        // ═══════════════════════════════════════════════
        // CATEGORY CHIPS
        // ═══════════════════════════════════════════════
        function renderCategoryChips() {
            const el = document.getElementById('categoryChips');
            el.innerHTML = CATEGORIES.map(c =>
                `<div class="chip ${c.id === currentCategory ? 'active' : ''}" data-cat="${c.id}" data-i18n="${c.i18n}" onclick="filterCategory('${c.id}', this)">${t(c.i18n)}</div>`
            ).join('');
        }

        function filterCategory(cat, chipEl) {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chipEl.classList.add('active');
            renderGames();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        // ═══════════════════════════════════════════════
        // GAMES GRID
        // ═══════════════════════════════════════════════
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            const filtered = currentCategory === 'all'
                ? GAMES
                : GAMES.filter(g => g.cat === currentCategory);

            grid.innerHTML = filtered.map(game => {
                const visual = game.img
                    ? `<img src="${game.img}" alt="${game.name}">`
                    : `<div class="game-card-emoji">${game.emoji}</div>`;

                return `
        <div class="game-card" onclick="openGameSheet('${game.id}')">
            <div class="game-card-glow" style="background:${game.color}"></div>
            ${visual}
            <div class="game-card-name">${game.name}</div>
            <div class="game-card-tag">${game.products.length} ${t(currentLang === 'uz' ? 'cat_other' : 'cat_other') ? 'tovar' : 'товар'}</div>
        </div>`;
            }).join('');

            // Fix the tag text properly
            grid.querySelectorAll('.game-card-tag').forEach((tag, i) => {
                const game = filtered[i];
                if (game) tag.textContent = `${game.products.length} ${currentLang === 'uz' ? 'tovar' : 'товаров'}`;
            });
        }

        // ═══════════════════════════════════════════════
        // GAME BOTTOM SHEET
        // ═══════════════════════════════════════════════
        function openGameSheet(gameId) {
            const game = GAMES.find(g => g.id === gameId);
            if (!game) return;
            selectedGame = game;

            // Show the first product by default; user can pick
            const sheetContent = document.getElementById('sheet');
            document.getElementById('sheetGameName').textContent = game.name;

            // Build product list inside sheet
            let productsHtml = game.products.map(p => {
                const price = new Intl.NumberFormat('ru-RU').format(p.price);
                return `<div class="settings-item" onclick="selectProduct('${p.sku}')" style="margin-bottom:6px">
            <div class="settings-item-left">
                <span class="settings-item-icon">${game.emoji}</span>
                <span class="settings-item-label">${p.name}</span>
            </div>
            <span class="settings-item-value" style="color:var(--accent);font-weight:700">${price} UZS</span>
        </div>`;
            }).join('');

            document.getElementById('sheetProductName').innerHTML = productsHtml;
            document.getElementById('sheetPlayerId').value = '';
            document.getElementById('btnBuy').style.display = 'none';
            document.getElementById('sheetPlayerId').parentElement.style.display = 'none';

            openSheetUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function selectProduct(sku) {
            const game = selectedGame;
            if (!game) return;
            selectedProduct = game.products.find(p => p.sku === sku);
            if (!selectedProduct) return;

            const price = new Intl.NumberFormat('ru-RU').format(selectedProduct.price);
            document.getElementById('sheetGameName').textContent = `${game.name} — ${selectedProduct.name}`;
            document.getElementById('sheetProductName').innerHTML = `<div style="font-size:22px;font-weight:800;color:var(--accent)">${price} UZS</div>`;

            document.getElementById('sheetPlayerId').parentElement.style.display = 'block';
            document.getElementById('btnBuy').style.display = 'block';
            document.getElementById('btnBuy').textContent = currentLang === 'uz' ? '⚡ Sotib olish' : '⚡ Купить';

            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function handleBuy() {
            const playerId = document.getElementById('sheetPlayerId').value.trim();
            if (!playerId) {
                showToast(t('enter_id_err'), 'error');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            const data = {
                action: 'buy',
                product_id: selectedProduct.sku,
                player_id: playerId
            };

            if (tg?.sendData) {
                tg.sendData(JSON.stringify(data));
            }

            // Add to local history
            mockHistory.unshift({
                type: 'purchase',
                name: `${selectedGame.name} — ${selectedProduct.name}`,
                amount: selectedProduct.price,
                date: new Date().toLocaleDateString('ru-RU'),
                status: 'pending',
                emoji: selectedGame.emoji
            });

            closeSheet();
            showToast(t('buy_sent'), 'success');
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        // ═══════════════════════════════════════════════
        // DEPOSIT (WALLET)
        // ═══════════════════════════════════════════════
        function renderAmountGrid() {
            const grid = document.getElementById('amountGrid');
            grid.innerHTML = DEPOSIT_AMOUNTS.map(a =>
                `<button class="amount-btn" onclick="selectAmount(this, ${a})">${new Intl.NumberFormat('ru-RU').format(a)}</button>`
            ).join('');
        }

        function selectAmount(btn, amount) {
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('depositInput').value = amount;
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function handleDeposit() {
            const amount = parseInt(document.getElementById('depositInput').value);
            if (!amount || amount < 1000) {
                showToast(t('deposit_min_err'), 'error');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            const data = { action: 'deposit', amount: amount };

            if (tg?.sendData) {
                tg.sendData(JSON.stringify(data));
            }

            // Add to local history
            mockHistory.unshift({
                type: 'deposit',
                name: t('order_deposit'),
                amount: amount,
                date: new Date().toLocaleDateString('ru-RU'),
                status: 'pending',
                emoji: '💳'
            });

            showToast(t('deposit_success'), 'success');
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function updateBalanceDisplay() {
            document.getElementById('headerBalance').textContent = new Intl.NumberFormat('ru-RU').format(userBalance);
            document.getElementById('walletBalance').textContent = new Intl.NumberFormat('ru-RU').format(userBalance);
        }

        // ═══════════════════════════════════════════════
        // HISTORY
        // ═══════════════════════════════════════════════
        function renderHistory() {
            const el = document.getElementById('historyList');

            if (mockHistory.length === 0) {
                el.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <div class="empty-state-text" data-i18n="no_orders">${t('no_orders')}</div>
                <div style="color:var(--text-muted);font-size:12px;margin-top:4px" data-i18n="no_orders_desc">${t('no_orders_desc')}</div>
            </div>`;
                return;
            }

            el.innerHTML = mockHistory.map(h => {
                const statusClass = h.status === 'success' ? 'status-success' : h.status === 'failed' ? 'status-failed' : 'status-pending';
                const statusText = h.status === 'success' ? '✓' : h.status === 'failed' ? '✗' : '⏳';
                const amountClass = h.type === 'deposit' ? 'credit' : 'debit';
                const sign = h.type === 'deposit' ? '+' : '-';

                return `
        <div class="history-item">
            <div class="history-icon" style="background:var(--glass)">${h.emoji}</div>
            <div class="history-info">
                <div class="history-name">${h.name}</div>
                <div class="history-date">${h.date} <span class="status-badge ${statusClass}">${statusText}</span></div>
            </div>
            <div class="history-amount ${amountClass}">${sign}${new Intl.NumberFormat('ru-RU').format(h.amount)}</div>
        </div>`;
            }).join('');
        }

        // ═══════════════════════════════════════════════
        // I18N
        // ═══════════════════════════════════════════════
        function t(key) {
            return T[currentLang]?.[key] || T['uz'][key] || key;
        }

        function setLang(lang) {
            currentLang = lang;

            // Update UI selection
            document.getElementById('langUz').classList.toggle('active', lang === 'uz');
            document.getElementById('langRu').classList.toggle('active', lang === 'ru');
            document.getElementById('checkUz').style.display = lang === 'uz' ? '' : 'none';
            document.getElementById('checkRu').style.display = lang === 'ru' ? '' : 'none';

            applyLang();
            renderCategoryChips();
            renderGames();
            renderHistory();

            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function applyLang() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const val = t(key);
                if (val) el.textContent = val;
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                const val = t(key);
                if (val) el.placeholder = val;
            });
        }

        // ═══════════════════════════════════════════════
        // SHEET HELPERS
        // ═══════════════════════════════════════════════
        function openSheetUI() {
            document.getElementById('overlay').classList.add('show');
            document.getElementById('sheet').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeSheet() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('sheet').classList.remove('show');
            document.body.style.overflow = '';
            selectedProduct = null;
        }

        // Swipe to close
        let sheetStartY = 0;
        document.getElementById('sheet')?.addEventListener('touchstart', e => {
            sheetStartY = e.touches[0].clientY;
        }, { passive: true });
        document.getElementById('sheet')?.addEventListener('touchmove', e => {
            if (e.touches[0].clientY - sheetStartY > 60) closeSheet();
        }, { passive: true });

        // ═══════════════════════════════════════════════
        // TOAST
        // ═══════════════════════════════════════════════
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ═══════════════════════════════════════════════
        // START
        // ═══════════════════════════════════════════════
        init();
    </script>
