<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин Доната</title>

    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* CSS Variables mapping to Telegram Native Theme */
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f0f0f0);

            --border-radius: 16px;
            --font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            --accent-glow: rgba(36, 129, 204, 0.2);
            --card-bg: rgba(var(--tg-theme-bg-color-rgb, 255, 255, 255), 0.7);
            --glass-border: 1px solid rgba(150, 150, 150, 0.1);
        }

        /* Basic Reset & Body */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
            /* Space for bottom nav */
            overflow-x: hidden;
        }

        /* 1. HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--button-color), #4facfe);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            object-fit: cover;
            box-shadow: 0 4px 10px var(--accent-glow);
        }

        .greeting {
            display: flex;
            flex-direction: column;
        }

        .greeting-text {
            font-size: 12px;
            color: var(--hint-color);
            margin: 0;
        }

        .user-name {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            background: var(--secondary-bg-color);
            padding: 6px 14px;
            border-radius: 20px;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s;
            border: var(--glass-border);
        }

        .header-right:active {
            transform: scale(0.95);
        }

        .coin-icon {
            font-size: 18px;
        }

        .balance-value {
            font-weight: 800;
            font-size: 15px;
            color: var(--text-color);
        }

        /* 2. MAIN TITLE */
        .page-title {
            padding: 24px 20px 16px;
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* 3. CATEGORIES (Pills) */
        .categories-scroll {
            display: flex;
            gap: 12px;
            padding: 0 20px 20px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 10px 20px;
            border-radius: 24px;
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            border: var(--glass-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .category-chip.active {
            background: var(--button-color);
            color: var(--button-text-color);
            box-shadow: 0 4px 12px var(--accent-glow);
            border-color: transparent;
        }

        /* 4. PRODUCT GRID */
        .grid-container {
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        /* 5. PRODUCT CARDS (Premium) */
        .product-card {
            background: var(--bg-color);
            border-radius: var(--border-radius);
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            border: var(--glass-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            overflow: hidden;
        }

        .product-card:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* Optional glassmorphism overlay */
        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
            border-radius: var(--border-radius);
            pointer-events: none;
        }

        .card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #FF3B30, #FF6B00);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(255, 59, 48, 0.3);
        }

        .card-icon {
            font-size: 38px;
            margin-bottom: 12px;
            align-self: flex-start;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: var(--text-color);
            line-height: 1.2;
        }

        .card-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--button-color);
            /* Cyan/Gold accent via theme */
            margin: 0;
            margin-top: auto;
        }

        /* Loading State */
        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--hint-color);
            font-size: 15px;
            font-weight: 500;
        }

        /* 6. BOTTOM NAVIGATION BAR */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px;
            /* Extra padding for iOS home indicator */
            border-top: var(--glass-border);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
            z-index: 100;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--hint-color);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            flex: 1;
        }

        .nav-item.active {
            color: var(--button-color);
        }

        .nav-icon {
            font-size: 22px;
            transition: transform 0.2s;
        }

        .nav-item:active .nav-icon {
            transform: scale(0.9);
        }

        /* 7. PURCHASE MODAL (BOTTOM SHEET) */
        .bottom-sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            display: flex;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            background: var(--bg-color);
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 30px 24px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.1);
        }

        .bottom-sheet-overlay.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: var(--hint-color);
            border-radius: 2px;
            margin: -15px auto 20px;
            opacity: 0.5;
        }

        .sheet-title {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .sheet-desc {
            font-size: 15px;
            color: var(--hint-color);
            margin: 0 0 24px 0;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--hint-color);
        }

        .premium-input {
            width: 100%;
            padding: 16px;
            background: var(--secondary-bg-color);
            border: 2px solid transparent;
            border-radius: 14px;
            font-size: 16px;
            color: var(--text-color);
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .premium-input:focus {
            border-color: var(--button-color);
            background: var(--bg-color);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0), 0 0 0 4px var(--accent-glow);
        }

        .sheet-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--button-color), #4facfe);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px var(--accent-glow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .sheet-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px var(--accent-glow);
        }
    </style>
</head>

<body>

    <!-- 1. HEADER -->
    <header class="header">
        <div class="header-left">
            <img id="userAvatarWrap" class="avatar" src="" style="display:none;">
            <div id="defaultAvatar" class="avatar">U</div>
            <div class="greeting">
                <p class="greeting-text">Welcome back,</p>
                <h2 class="user-name" id="userName">Guest</h2>
            </div>
        </div>
        <div class="header-right" onclick="sendTopupAction()">
            <span class="coin-icon">💰</span>
            <span class="balance-value" id="userBalance">0</span>
        </div>
    </header>

    <!-- 2. TITLE -->
    <h1 class="page-title">Выберите товар</h1>

    <!-- 3. CATEGORIES -->
    <div class="categories-scroll" id="categoriesWrapper">
        <div class="category-chip active" onclick="filterCategory('All', this)">🔥 All</div>
        <div class="category-chip" onclick="filterCategory('Mobile Legends', this)">Mobile Legends</div>
        <div class="category-chip" onclick="filterCategory('PUBG Mobile', this)">PUBG Mobile</div>
        <div class="category-chip" onclick="filterCategory('Free Fire', this)">Free Fire</div>
        <div class="category-chip" onclick="filterCategory('Roblox', this)">Roblox</div>
    </div>

    <!-- 4 & 5. PRODUCT GRID & CARDS -->
    <main class="grid-container" id="productsGrid">
        <div class="loading-state">Загрузка каталога...</div>
    </main>

    <!-- 6. BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="sendTopupAction()">
            <span class="nav-icon">👛</span>
            <span>Wallet</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📜</span>
            <span>History</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">⚙️</span>
            <span>Settings</span>
        </div>
    </nav>

    <!-- 7. PURCHASE MODAL (BOTTOM SHEET) -->
    <div class="bottom-sheet-overlay" id="bottomSheet" onclick="closeSheetOnBackground(event)">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <h3 class="sheet-title">Оформление заказа</h3>
            <p class="sheet-desc" id="sheetProductName">Товар: ...</p>

            <div class="input-group">
                <label class="input-label" for="playerIdInput">Player ID (ID Игрока)</label>
                <input type="text" id="playerIdInput" class="premium-input"
                    placeholder="Введите ваш ID (напр. 12345678)" inputmode="numeric">
            </div>

            <button class="sheet-btn" onclick="confirmPurchase()">Подтвердить покупку</button>
        </div>
    </div>

    <!-- MAIN LOGIC -->
    <script>
        const tg = window.Telegram.WebApp;

        let currentProductId = null;
        let allProducts = [];

        // API Endpoint for Catalog
        const API_URL = 'http://localhost:8080/api/catalog';

        document.addEventListener("DOMContentLoaded", () => {
            // WebApp Init
            tg.expand();
            tg.ready();
            tg.disableClosingConfirmation(); // By user request

            // Setup Header User Info
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('userName').textContent = user.first_name || 'Guest';

                // Set first letter as default avatar if no photo
                if (user.first_name) {
                    document.getElementById('defaultAvatar').textContent = user.first_name.charAt(0).toUpperCase();
                }

                if (user.photo_url) {
                    const img = document.getElementById('userAvatarWrap');
                    img.src = user.photo_url;
                    img.style.display = 'flex';
                    document.getElementById('defaultAvatar').style.display = 'none';
                }
            }

            // Fetch Data
            fetchCatalog();
        });

        async function fetchCatalog() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();

                if (data.status === 'success') {
                    allProducts = data.data;
                    renderProducts(allProducts);
                } else {
                    renderMockDataFallback("Failed to load");
                }
            } catch (error) {
                console.error("Error fetching catalog:", error);
                renderMockDataFallback(error);
            }
        }

        function renderMockDataFallback(err) {
            allProducts = [
                { id: "mlbb_86", category: "Mobile Legends", name: "86 💎", price: 16000, icon: "💎", badge: "HOT" },
                { id: "pubg_60", category: "PUBG Mobile", name: "60 UC", price: 15000, icon: "💥", badge: "" },
                { id: "ff_100", category: "Free Fire", name: "100 💎", price: 12000, icon: "🔥", badge: "x2" },
                { id: "roblox_80", category: "Roblox", name: "80 R$", price: 18000, icon: "🎮", badge: "" }
            ];
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = '<div class="loading-state">Нет товаров</div>';
                return;
            }

            products.forEach(p => {
                const priceFormatted = new Intl.NumberFormat('ru-RU').format(p.price);
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openBottomSheet(p.id, p.name, p.price);

                let badgeHTML = p.badge ? `<div class="card-badge">${p.badge}</div>` : '';

                card.innerHTML = `
                    ${badgeHTML}
                    <div class="card-icon">${p.icon || '📦'}</div>
                    <h4 class="card-title">${p.name}</h4>
                    <p class="card-price">${priceFormatted} UZS</p>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, element) {
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();

            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');

            if (category === 'All') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function sendTopupAction() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            const data = JSON.stringify({ action: 'topup' });
            tg.sendData(data);
        }

        // Bottom Sheet Logic
        function openBottomSheet(productId, productName, productPrice) {
            currentProductId = productId;
            const priceFormatted = new Intl.NumberFormat('ru-RU').format(productPrice);
            document.getElementById('sheetProductName').textContent = `${productName} — ${priceFormatted} UZS`;
            document.getElementById('playerIdInput').value = '';

            const overlay = document.getElementById('bottomSheet');
            overlay.classList.add('active');

            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function closeBottomSheet() {
            document.getElementById('bottomSheet').classList.remove('active');
            currentProductId = null;
        }

        function closeSheetOnBackground(e) {
            if (e.target.id === 'bottomSheet') {
                closeBottomSheet();
            }
        }

        function confirmPurchase() {
            const playerId = document.getElementById('playerIdInput').value.trim();

            if (!playerId) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("Пожалуйста, введите Player ID!");
                return;
            }

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            const data = JSON.stringify({
                action: 'buy',
                product_id: currentProductId,
                player_id: playerId
            });

            tg.sendData(data);
            closeBottomSheet();
        }
    </script>
</body>

</html>
