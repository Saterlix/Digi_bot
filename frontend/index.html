<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Antigravity Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-main: #0c0c1e;
            --bg-card: #15152b;
            --primary: #5847ff;
            --primary-light: #7b6dff;
            --secondary: #00e0ff;
            --accent: #ff0055;
            --text: #ffffff;
            --text-muted: #8a8aa0;
            --gold: #ffd700;

            --nav-height: 80px;
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            padding-bottom: var(--nav-height);
        }

        #app {
            width: 100%;
            max-width: 480px;
            background: var(--bg-main);
            position: relative;
        }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #3d3d5c, #2a2a40);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            overflow: hidden;
        }

        .username {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .balance-badge {
            background: linear-gradient(90deg, #5847ff, #4030c2);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(88, 71, 255, 0.3);
        }

        .coin-icon {
            color: var(--gold);
            font-size: 1.1rem;
        }

        /* ACTION BUTTONS */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: #ffffff;
            color: #0c0c1e;
            border-radius: var(--radius-md);
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-icon {
            width: 40px;
            height: 40px;
            background: rgba(88, 71, 255, 0.1);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            color: var(--primary);
        }

        .action-text {
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.2;
        }

        /* BANNER */
        .banner-container {
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .banner {
            background: linear-gradient(135deg, #150050 0%, #3f0099 100%);
            border-radius: var(--radius-lg);
            padding: 20px;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .banner h2 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            z-index: 1;
        }

        .banner p {
            opacity: 0.8;
            font-size: 0.9rem;
            z-index: 1;
        }

        .banner-glow {
            position: absolute;
            right: -20px;
            bottom: -40px;
            width: 120px;
            height: 120px;
            background: var(--secondary);
            filter: blur(50px);
            opacity: 0.4;
        }

        /* TABS */
        .tabs-container {
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .segment-control {
            background: var(--bg-card);
            padding: 4px;
            border-radius: 14px;
            display: flex;
        }

        .segment-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 10px;
            transition: all 0.2s;
        }

        .segment-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* GRID */
        .section-header {
            padding: 0 16px;
            margin-bottom: 16px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 0 16px 20px;
        }

        .game-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
            transition: transform 0.1s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-card:active {
            transform: scale(0.96);
        }

        .game-image-wrap {
            height: 120px;
            background: #2a2a40;
            position: relative;
        }

        .game-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            padding: 12px;
            text-align: center;
        }

        .game-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .game-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .tag-hot {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: var(--nav-height);
            background: #121225;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 20px 20px 0 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
            padding-bottom: 10px;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link.active {
            color: var(--secondary);
        }

        .nav-link i {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        /* MODALS (Sheet) */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            z-index: 201;
            transform: translateY(100%);
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sheet.active {
            transform: translateY(0);
        }

        .sheet-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-box {
            background: #0c0c1e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 20px;
            outline: none;
        }

        .input-box:focus {
            border-color: var(--primary);
        }

        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(88, 71, 255, 0.4);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #1a1a2e;
            border: 1px solid #555;
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 300;
            opacity: 0;
            transition: 0.3s;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success i {
            color: #00e0ff;
        }

        .toast.error i {
            color: #ff0055;
        }
    </style>
</head>

<body>

    <div id="app">
        <!-- HEADER -->
        <header class="header">
            <div class="user-info">
                <div class="avatar" id="avatar">
                    <i class="ri-user-smile-line"></i>
                    <img id="avatar-img" src="" style="display:none; width:100%; height:100%;">
                </div>
                <div class="username" id="username">Guest</div>
            </div>
            <div class="balance-badge">
                <i class="ri-copper-coin-fill coin-icon"></i>
                <span id="balance">0</span>
            </div>
        </header>

        <!-- ACTION BUTTONS -->
        <div class="actions-grid">
            <div class="action-btn" onclick="openDeposit()">
                <div class="action-icon"><i class="ri-wallet-3-fill"></i></div>
                <div class="action-text">Hisobni<br>to'ldirish</div>
            </div>
            <div class="action-btn">
                <div class="action-icon" style="background: rgba(0, 224, 255, 0.1); color: var(--secondary);"><i
                        class="ri-gift-2-fill"></i></div>
                <div class="action-text">Bonus<br>kodlar</div>
            </div>
            <div class="action-btn">
                <div class="action-icon" style="background: rgba(255, 0, 85, 0.1); color: var(--accent);"><i
                        class="ri-history-fill"></i></div>
                <div class="action-text">To'lov<br>tarixi</div>
            </div>
        </div>

        <!-- BANNER -->
        <div class="banner-container">
            <div class="banner">
                <h2>Double Promo</h2>
                <p>Get 2x UC on first deposit!</p>
                <div class="banner-glow"></div>
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs-container">
            <div class="segment-control">
                <div class="segment-btn active">ID</div>
                <div class="segment-btn">Promo kod</div>
                <div class="segment-btn">Avto (24/7)</div>
            </div>
        </div>

        <!-- GAMES -->
        <h3 class="section-header">Mashhur e'lonlar</h3>
        <div class="games-grid" id="catalog">
            <!-- Rendered via JS -->
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-link active">
            <i class="ri-home-4-fill"></i>
            <span>Asosiy</span>
        </div>
        <div class="nav-link">
            <i class="ri-wallet-fill"></i>
            <span>Hamyon</span>
        </div>
        <div class="nav-link">
            <i class="ri-time-fill"></i>
            <span>Tarix</span>
        </div>
        <div class="nav-link">
            <i class="ri-settings-4-fill"></i>
            <span>Sozlamalar</span>
        </div>
    </nav>

    <!-- MODALS -->
    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <!-- Deposit Sheet -->
    <div class="sheet" id="deposit-sheet">
        <div class="sheet-title">Hisobni to'ldirish</div>
        <input type="number" id="deposit-amount" class="input-box" placeholder="Summani kiriting (UZS)">
        <button class="btn-main" onclick="processDeposit()">To'lash</button>
    </div>

    <!-- Buy Sheet -->
    <div class="sheet" id="buy-sheet">
        <div class="sheet-title" id="buy-title">Product</div>
        <input type="number" id="player-id" class="input-box" placeholder="Player ID">
        <button class="btn-main" onclick="processBuy()">Sotib olish</button>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <i class="ri-checkbox-circle-fill"></i>
        <span id="toast-msg">Success</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // STATE
        const state = {
            user: { id: 0, name: "Guest", balance: 0 },
            catalog: [
                { id: 1, name: "PUBG Mobile", type: "UC", image: "https://wallpapers.com/images/hd/pubg-mobile-4k-3840-x-2160-wallpaper-z6o6e6k6k6k6k6k6.jpg", color: "#fca311" },
                { id: 2, name: "Free Fire", type: "Diamonds", image: "https://wallpapers.com/images/hd/garena-free-fire-4k-gaming-wallpaper-7c7c7c7c7c7c7c7c.jpg", color: "#ffaa00" },
                { id: 3, name: "Mobile Legends", type: "Diamonds", image: "https://wallpapers.com/images/hd/mobile-legends-bang-bang-4k-wallpaper-5e5e5e5e5e5e5e5e.jpg", color: "#bd00ff" },
                { id: 4, name: "Brawl Stars", type: "Gems", image: "https://wallpapers.com/images/hd/brawl-stars-4k-wallpaper-4k4k4k4k4k4k4k4.jpg", color: "#00e0ff" }
            ]
        };

        // INIT
        if (tg.initDataUnsafe?.user) {
            state.user.name = tg.initDataUnsafe.user.first_name;
            state.user.id = tg.initDataUnsafe.user.id;
            document.getElementById('username').innerText = state.user.name;
        }

        renderCatalog();

        // RENDER LOGIC
        function renderCatalog() {
            const grid = document.getElementById('catalog');
            grid.innerHTML = "";

            state.catalog.forEach(game => {
                const card = document.createElement('div');
                card.className = "game-card";
                card.onclick = () => openBuy(game);

                // Generate visual placeholder if image fails (simulated)
                card.innerHTML = `
                <div class="game-image-wrap">
                    <div class="tag-hot">HOT</div>
                    <div style="width:100%; height:100%; background: ${game.color}; opacity: 0.2;"></div>
                    <i class="ri-gamepad-fill" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:2rem; color:${game.color}"></i>
                </div>
                <div class="game-info">
                    <div class="game-title">${game.name}</div>
                    <div class="game-subtitle">Avto to'lov</div>
                </div>
            `;
                grid.appendChild(card);
            });
        }

        // ACTIONS
        window.openDeposit = () => {
            document.getElementById('overlay').classList.add('active');
            document.getElementById('deposit-sheet').classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        };

        let selectedGame = null;
        window.openBuy = (game) => {
            selectedGame = game;
            document.getElementById('buy-title').innerText = game.name; // + " (" + game.type + ")";
            document.getElementById('overlay').classList.add('active');
            document.getElementById('buy-sheet').classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        };

        window.closeAll = () => {
            document.getElementById('overlay').classList.remove('active');
            document.querySelectorAll('.sheet').forEach(s => s.classList.remove('active'));
        };

        window.processDeposit = () => {
            const val = parseInt(document.getElementById('deposit-amount').value);
            if (!val) return showToast("Summani kiriting", false);

            state.user.balance += val;
            document.getElementById('balance').innerText = state.user.balance.toLocaleString();

            closeAll();
            showToast("Balans to'ldirildi!", true);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        };

        window.processBuy = () => {
            const id = document.getElementById('player-id').value;
            if (!id) return showToast("ID kiriting", false);

            closeAll();
            showToast("Sorovingiz qabul qilindi!", true);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        };

        function showToast(msg, success) {
            const el = document.getElementById('toast');
            const icon = el.querySelector('i');
            const text = document.getElementById('toast-msg');

            text.innerText = msg;
            icon.className = success ? "ri-checkbox-circle-fill" : "ri-error-warning-fill";
            el.className = `toast show ${success ? 'success' : 'error'}`;

            setTimeout(() => {
                el.classList.remove('show');
            }, 3000);
        }
    </script>
</body>

</html>
