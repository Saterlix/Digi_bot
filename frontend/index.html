<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин Доната</title>

    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* CSS Variables mapping to Telegram Native Theme */
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f0f0f0);

            --border-radius: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
            padding-bottom: 80px;
            /* Space for bottom nav */
        }

        /* Profile & Balance Area */
        .header-section {
            background-color: var(--bg-color);
            padding: 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
        }

        .profile-line {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--secondary-bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
            object-fit: cover;
        }

        .profile-name {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
        }

        .balance-card {
            background: linear-gradient(135deg, var(--button-color), #4facfe);
            border-radius: var(--border-radius);
            padding: 20px;
            color: white;
            box-shadow: 0 4px 15px rgba(36, 129, 204, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-info {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }

        .topup-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .topup-btn:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Horizontal Scrollable Categories */
        .categories-wrapper {
            padding: 0 15px;
            margin-bottom: 15px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            /* Firefox */
        }

        .categories-wrapper::-webkit-scrollbar {
            display: none;
            /* Chrome/Safari */
        }

        .chip {
            display: inline-block;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
        }

        .chip.active {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }

        /* CSS Grid Catalog */
        .catalog-container {
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .product-card {
            background-color: var(--bg-color);
            border-radius: var(--border-radius);
            padding: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .product-card:active {
            transform: scale(0.96);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .product-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #ff3b30;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 6px;
        }

        .product-icon {
            font-size: 40px;
            margin-bottom: 10px;
            margin-top: 5px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-title {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 5px 0;
            line-height: 1.2;
            color: var(--text-color);
        }

        .product-price {
            font-size: 13px;
            color: var(--button-color);
            font-weight: 800;
            text-align: center;
            margin: 0;
            margin-top: auto;
            background: var(--secondary-bg-color);
            padding: 4px 10px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            color: var(--hint-color);
            font-size: 14px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--hint-color);
            font-size: 12px;
        }

        .nav-item.active {
            color: var(--button-color);
        }

        .nav-icon {
            font-size: 20px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--bg-color);
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 500px;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }

        .modal-desc {
            color: var(--hint-color);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .modern-input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--secondary-bg-color);
            border-radius: 12px;
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .modern-input:focus {
            border-color: var(--button-color);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
        }

        .btn-confirm {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }
    </style>
</head>

<body>

    <!-- Header & Balance -->
    <div class="header-section">
        <div class="profile-line">
            <img id="userAvatarWrap" class="profile-avatar" src="" style="display:none;">
            <div id="defaultAvatar" class="profile-avatar">👤</div>
            <div class="profile-name" id="userName">Гость</div>
        </div>

        <div class="balance-card">
            <div class="balance-info">
                <span class="balance-label">Кошелек</span>
                <span class="balance-amount">Баланс UZS</span>
            </div>
            <button class="topup-btn" onclick="sendTopupAction()">Пополнить</button>
        </div>
    </div>

    <!-- Category Chips -->
    <div class="categories-wrapper" id="categoriesWrapper">
        <div class="chip active" onclick="filterCategory('All', this)">🔥 Все</div>
        <div class="chip" onclick="filterCategory('Mobile Legends', this)">Mobile Legends</div>
        <div class="chip" onclick="filterCategory('PUBG Mobile', this)">PUBG Mobile</div>
        <div class="chip" onclick="filterCategory('Free Fire', this)">Free Fire</div>
        <div class="chip" onclick="filterCategory('Roblox', this)">Roblox</div>
    </div>

    <!-- Catalog Grid -->
    <div class="catalog-container">
        <div class="products-grid" id="productsGrid">
            <div class="loading-state">Загрузка каталога...</div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="sendTopupAction()">
            <div class="nav-icon">钱包</div>
            <span>Кошелек</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">🧾</div>
            <span>История</span>
        </div>
    </div>

    <!-- Purchase Modal -->
    <div class="modal-overlay" id="buyModal">
        <div class="modal-content">
            <h3 class="modal-title">Оформление заказа</h3>
            <p class="modal-desc" id="modalProductName">Товар: ...</p>

            <div class="input-group">
                <label class="input-label" for="playerIdInput">Введите ID игрока:</label>
                <input type="text" id="playerIdInput" class="modern-input" placeholder="Например: 12345678"
                    inputmode="numeric">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn btn-confirm" onclick="confirmPurchase()">Купить</button>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script>
        const tg = window.Telegram.WebApp;

        let currentProductId = null;
        let allProducts = [];

        // Configure API URL (For Vercel / Local)
        // Adjust this if you deploy the backend somewhere else. Localhost works for local dev testing.
        // For production, change to your actual backend domain e.g., 'https://api.yourdomain.com'
        const API_URL = 'http://localhost:8080/api/catalog';

        document.addEventListener("DOMContentLoaded", () => {
            tg.expand();
            tg.ready();

            // Set up user info
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('userName').textContent = user.first_name || 'Пользователь';
                if (user.photo_url) {
                    const img = document.getElementById('userAvatarWrap');
                    img.src = user.photo_url;
                    img.style.display = 'block';
                    document.getElementById('defaultAvatar').style.display = 'none';
                }
            }

            // Fetch Catalog
            fetchCatalog();
        });

        async function fetchCatalog() {
            try {
                // Fetch from the Python aiohttp backend
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                if (data.status === 'success') {
                    allProducts = data.data;
                    renderProducts(allProducts);
                } else {
                    showError("Не удалось загрузить товары.");
                }
            } catch (error) {
                console.error("Error fetching catalog:", error);

                // Fallback local mock data just in case API fails (for demo purposes)
                allProducts = [
                    { id: "mlbb_86", category: "Mobile Legends", name: "86 💎", price: 16000, icon: "💎", badge: "-15%" },
                    { id: "pubg_60", category: "PUBG Mobile", name: "60 UC", price: 15000, icon: "💥", badge: "Hot" }
                ];
                renderProducts(allProducts);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = '<div class="loading-state">Нет товаров в этой категории.</div>';
                return;
            }

            products.forEach(p => {
                // Formatting price
                const priceFormatted = new Intl.NumberFormat('ru-RU').format(p.price);

                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openBuyModal(p.id, p.name, p.price);

                let badgeHTML = '';
                if (p.badge) {
                    badgeHTML = `<div class="product-badge">${p.badge}</div>`;
                }

                card.innerHTML = `
                    ${badgeHTML}
                    <div class="product-icon">${p.icon || '📦'}</div>
                    <h4 class="product-title">${p.name}</h4>
                    <div class="product-price">${priceFormatted} UZS</div>
                `;

                grid.appendChild(card);
            });
        }

        function filterCategory(category, element) {
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();

            // Update active chip
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');

            if (category === 'All') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function sendTopupAction() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            const data = JSON.stringify({ action: 'topup' });
            tg.sendData(data);
        }

        function openBuyModal(productId, productName, productPrice) {
            currentProductId = productId;
            const priceFormatted = new Intl.NumberFormat('ru-RU').format(productPrice);
            document.getElementById('modalProductName').textContent = `${productName} — ${priceFormatted} UZS`;
            document.getElementById('playerIdInput').value = '';

            document.getElementById('buyModal').classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function closeModal() {
            document.getElementById('buyModal').classList.remove('active');
            currentProductId = null;
        }

        function confirmPurchase() {
            const playerId = document.getElementById('playerIdInput').value.trim();

            if (!playerId) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("Пожалуйста, введите ID игрока!");
                return;
            }

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            const data = JSON.stringify({
                action: 'buy',
                product_id: currentProductId,
                player_id: playerId
            });

            tg.sendData(data);
            closeModal();
        }
    </script>
</body>

</html>
